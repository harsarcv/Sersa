services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sersa-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sersa-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgres://sersa_user:sersa_password@database:5432/sersa_db
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    container_name: sersa-database
    environment:
      POSTGRES_USER: sersa_user
      POSTGRES_PASSWORD: sersa_password
      POSTGRES_DB: sersa_db
    ports:
      - "5433:5432"
    volumes:
      - sersa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sersa_user -d sersa_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  sersa_postgres_data: